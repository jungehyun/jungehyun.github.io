<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1c1917">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44403c"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c4a1e"/></marker>
  
<linearGradient id="trunk" x1="0" x2="1"><stop offset="0" stop-color="#6b4a2e"/><stop offset=".5" stop-color="#8a6a48"/><stop offset="1" stop-color="#5c4330"/></linearGradient>
<linearGradient id="core" x1="0" x2="1"><stop offset="0" stop-color="#6e5139"/><stop offset=".45" stop-color="#9c7a55"/><stop offset="1" stop-color="#5c4330"/></linearGradient>
<linearGradient id="coretop" x1="0" x2="1"><stop offset="0" stop-color="#3f2d20"/><stop offset=".45" stop-color="#5c4330"/><stop offset="1" stop-color="#33241a"/></linearGradient>
<linearGradient id="soilg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5b3f"/><stop offset="1" stop-color="#5c4330"/></linearGradient>
</defs>
  <!-- three steps -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="140" y="48">Measure</text><text x="400" y="48">Model</text><text x="660" y="48">Report &amp; verify</text>
  </g>
  <g stroke="#44403c" stroke-width="2.2" marker-end="url(#ah)">
    <line x1="252" y1="200" x2="286" y2="200"/><line x1="512" y1="200" x2="546" y2="200"/>
  </g>
  <!-- step 1: field + instruments -->
  <rect x="30" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- soil cores -->
<g transform="translate(95 196) scale(0.72)">
<rect x="-47" y="-130" width="26" height="130" fill="url(#core)"/><rect x="-47" y="-130" width="26" height="42" fill="url(#coretop)"/><path d="M-47 -88 q 6 -4 13 0 t 13 0" fill="none" stroke="#2f2118" stroke-width="1.5"/><ellipse cx="-34" cy="-130" rx="13" ry="4" fill="#3f2d20" stroke="#2f2118"/><ellipse cx="-34" cy="0" rx="13" ry="4" fill="#8a6a48" stroke="#5c4330"/><circle cx="-40" cy="-60" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-29" cy="-40" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-36" cy="-20" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-27" cy="-85" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-42" cy="-100" r="1.3" fill="#d6c3a5" opacity=".8"/>
<rect x="-13" y="-130" width="26" height="130" fill="url(#core)"/><rect x="-13" y="-130" width="26" height="29" fill="url(#coretop)"/><path d="M-13 -101 q 6 -4 13 0 t 13 0" fill="none" stroke="#2f2118" stroke-width="1.5"/><ellipse cx="0" cy="-130" rx="13" ry="4" fill="#3f2d20" stroke="#2f2118"/><ellipse cx="0" cy="0" rx="13" ry="4" fill="#8a6a48" stroke="#5c4330"/><circle cx="-6" cy="-60" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="5" cy="-40" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-2" cy="-20" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="7" cy="-85" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="-8" cy="-100" r="1.3" fill="#d6c3a5" opacity=".8"/>
<rect x="21" y="-130" width="26" height="130" fill="url(#core)"/><rect x="21" y="-130" width="26" height="52" fill="url(#coretop)"/><path d="M21 -78 q 6 -4 13 0 t 13 0" fill="none" stroke="#2f2118" stroke-width="1.5"/><ellipse cx="34" cy="-130" rx="13" ry="4" fill="#3f2d20" stroke="#2f2118"/><ellipse cx="34" cy="0" rx="13" ry="4" fill="#8a6a48" stroke="#5c4330"/><circle cx="28" cy="-60" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="39" cy="-40" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="32" cy="-20" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="41" cy="-85" r="1.3" fill="#d6c3a5" opacity=".8"/><circle cx="26" cy="-100" r="1.3" fill="#d6c3a5" opacity=".8"/>
<rect x="54" y="-130" width="10" height="130" fill="#fff" stroke="#a8a29e"/><line x1="54" y1="-130" x2="64" y2="-130" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-120" x2="60" y2="-120" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-110" x2="60" y2="-110" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-100" x2="60" y2="-100" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-90" x2="60" y2="-90" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-80" x2="64" y2="-80" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-70" x2="60" y2="-70" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-60" x2="60" y2="-60" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-50" x2="60" y2="-50" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-40" x2="60" y2="-40" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-30" x2="64" y2="-30" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-20" x2="60" y2="-20" stroke="#78716c" stroke-width="1"/><line x1="54" y1="-10" x2="60" y2="-10" stroke="#78716c" stroke-width="1"/><line x1="54" y1="0" x2="60" y2="0" stroke="#78716c" stroke-width="1"/></g><text x="89" y="214" font-size="14" text-anchor="middle" fill="#78716c">field samples</text>
  <!-- thermogram icon -->
<g transform="translate(148 100)"><rect x="0" y="0" width="90" height="60" rx="4" fill="#fff" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="8" y1="52" x2="84" y2="52" stroke="#a8a29e"/><line x1="8" y1="52" x2="8" y2="6" stroke="#a8a29e"/>
  <path d="M8 51 C 20 50, 25 18, 34 18 C 43 18, 45 48, 54 46 C 63 44, 67 27, 74 27 C 81 27, 83 48, 84 51" fill="#7c4a1e" fill-opacity=".12" stroke="#7c4a1e" stroke-width="2.2"/></g><text x="193" y="178" font-size="13" text-anchor="middle" fill="#78716c">thermal analysis</text>
  <!-- spectrum icon -->
<g transform="translate(148 190)"><rect x="0" y="0" width="90" height="60" rx="4" fill="#fff" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="8" y1="52" x2="84" y2="52" stroke="#a8a29e"/><line x1="8" y1="52" x2="8" y2="6" stroke="#a8a29e"/>
  <path d="M8 33 C 18 30, 27 48, 38 37 C 47 30, 52 15, 61 24 C 70 33, 77 18, 84 21" fill="none" stroke="#2563eb" stroke-width="2.2"/></g><text x="193" y="268" font-size="13" text-anchor="middle" fill="#78716c">spectroscopy</text>
  <!-- flux chamber icon -->
<g transform="translate(89 262) scale(0.9)"><rect x="-40" y="-6" width="80" height="12" fill="url(#soilg)"/>
  <path d="M-30 -6 L-30 -22 A30 22 0 0 1 30 -22 L30 -6 Z" fill="#fde68a" fill-opacity=".85" stroke="#a16207" stroke-width="1.5"/>
  <rect x="-34" y="-8" width="68" height="4" fill="#78716c"/><line x1="30" y1="-14" x2="48" y2="-14" stroke="#44403c" stroke-width="1.5"/><rect x="48" y="-22" width="14" height="16" fill="#fff" stroke="#44403c"/>
  <g stroke="#44403c" stroke-width="1.6" marker-end="url(#ah)"><line x1="-8" y1="-8" x2="-8" y2="-18"/><line x1="8" y1="-8" x2="8" y2="-18"/></g></g>
  <text x="89" y="290" font-size="13" text-anchor="middle" fill="#78716c">soil CO₂ flux</text>
  <text x="140" y="312" font-size="14" text-anchor="middle">low-cost, rapid, in the field</text>
  <!-- step 2: model -->
  <rect x="290" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- pools mini diagram -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="312" y="104" width="54" height="26" rx="3" fill="#fde68a" stroke="#a16207"/><text x="339" y="121">litter</text>
    <rect x="378" y="104" width="54" height="26" rx="3" fill="#fde68a" stroke="#a16207"/><text x="405" y="121">POM</text>
    <rect x="444" y="104" width="54" height="26" rx="3" fill="#e7d3c2" stroke="#7c4a1e"/><text x="471" y="121">MAOM</text>
  </g>
  <g stroke="#44403c" stroke-width="1.6" marker-end="url(#ah)"><line x1="366" y1="117" x2="376" y2="117"/><line x1="432" y1="117" x2="442" y2="117"/></g>
  <text x="400" y="150" font-size="13" text-anchor="middle" fill="#78716c">process model (RothC-type)</text>
  <!-- obs vs model scatter -->
<g transform="translate(330 166)"><rect width="140" height="110" fill="#fff" stroke="#a8a29e" stroke-width="1.5"/><line x1="6" y1="104" x2="134" y2="6" stroke="#a8a29e" stroke-dasharray="5 4"/><circle cx="14" cy="95" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="28" cy="86" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="42" cy="75" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="50" cy="68" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="64" cy="57" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="73" cy="55" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="84" cy="44" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="98" cy="33" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="112" cy="24" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="126" cy="13" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="59" cy="66" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="92" cy="44" r="3.2" fill="#7c4a1e" fill-opacity=".85"/><circle cx="36" cy="81" r="3.2" fill="#7c4a1e" fill-opacity=".85"/></g>
    <text x="400" y="294" font-size="13" text-anchor="middle" fill="#78716c">calibrated on field experiments</text>
  <text x="400" y="312" font-size="14" text-anchor="middle">rates set by soil and climate</text>
  <!-- step 3: output -->
  <rect x="550" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- stock change bars with uncertainty -->
  <g>
    <line x1="580" y1="250" x2="740" y2="250" stroke="#a8a29e"/>
    <rect x="600" y="190" width="30" height="60" fill="#e7d3c2" stroke="#7c4a1e"/><line x1="615" y1="176" x2="615" y2="204" stroke="#44403c" stroke-width="1.6"/>
    <rect x="645" y="160" width="30" height="90" fill="#7c4a1e"/><line x1="660" y1="140" x2="660" y2="180" stroke="#44403c" stroke-width="1.6"/>
    <rect x="690" y="206" width="30" height="44" fill="#e7d3c2" stroke="#7c4a1e"/><line x1="705" y1="190" x2="705" y2="222" stroke="#44403c" stroke-width="1.6"/>
    <text x="660" y="272" font-size="13" text-anchor="middle" fill="#78716c">stock change ± uncertainty</text>
    <text x="660" y="120" font-size="14" text-anchor="middle">field → region → nation</text>
  </g>
  <text x="660" y="312" font-size="14" text-anchor="middle">credit only what can be verified</text>
  <!-- bottom: target -->
  <rect x="30" y="360" width="740" height="200" rx="8" fill="#fff" stroke="#7c4a1e" stroke-width="1.8"/>
  <text x="400" y="396" font-size="20" font-weight="700" text-anchor="middle" fill="#7c4a1e">Low-cost, high-efficiency MRV for soil-based carbon dioxide removal</text>
  <g font-size="16" text-anchor="middle">
    <text x="400" y="432">Sejong Science Fellowship · National Research Foundation of Korea · 2024–2028</text>
    <text x="400" y="470" fill="#44403c">Pieces already in place: thermal separation of carbon forms (Hyun et al. 2025),</text>
    <text x="400" y="494" fill="#44403c">modified RothC with field-calibrated modifiers and Monte-Carlo uncertainty,</text>
    <text x="400" y="518" fill="#44403c">a national-scale assessment framework (Hyun &amp; Yoo 2024), two patents on SOC-change calculation.</text>
  </g>
</svg>
