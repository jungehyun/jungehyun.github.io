<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1c1917">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44403c"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c4a1e"/></marker>
  </defs>
  <!-- three steps -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="140" y="48">Measure</text><text x="400" y="48">Model</text><text x="660" y="48">Report &amp; verify</text>
  </g>
  <g stroke="#44403c" stroke-width="2.2" marker-end="url(#ah)">
    <line x1="252" y1="200" x2="286" y2="200"/><line x1="512" y1="200" x2="546" y2="200"/>
  </g>
  <!-- step 1: field + instruments -->
  <rect x="30" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- soil cores -->
  <g>
    <rect x="52" y="100" width="18" height="90" rx="3" fill="#8a6a48" stroke="#5c4330"/><rect x="52" y="100" width="18" height="30" rx="3" fill="#5c4330"/>
    <rect x="80" y="100" width="18" height="90" rx="3" fill="#8a6a48" stroke="#5c4330"/><rect x="80" y="100" width="18" height="24" rx="3" fill="#5c4330"/>
    <rect x="108" y="100" width="18" height="90" rx="3" fill="#8a6a48" stroke="#5c4330"/><rect x="108" y="100" width="18" height="40" rx="3" fill="#5c4330"/>
    <text x="89" y="212" font-size="14" text-anchor="middle" fill="#78716c">field samples</text>
  </g>
  <!-- thermogram icon -->
  <g>
    <rect x="148" y="100" width="90" height="60" rx="4" fill="#fff" stroke="#a8a29e"/>
    <path d="M154 152 C 170 150, 176 120, 186 118 C 196 116, 200 146, 210 140 C 218 136, 222 112, 232 108" fill="none" stroke="#7c4a1e" stroke-width="2"/>
    <text x="193" y="178" font-size="13" text-anchor="middle" fill="#78716c">thermal analysis</text>
  </g>
  <!-- spectrum icon -->
  <g>
    <rect x="148" y="190" width="90" height="60" rx="4" fill="#fff" stroke="#a8a29e"/>
    <path d="M154 232 C 170 236, 178 206, 190 214 C 200 220, 206 240, 216 226 C 224 216, 228 212, 232 220" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="193" y="268" font-size="13" text-anchor="middle" fill="#78716c">spectroscopy</text>
  </g>
  <!-- flux chamber icon -->
  <g>
    <rect x="52" y="236" width="74" height="34" rx="4" fill="#fff" stroke="#a8a29e"/>
    <rect x="62" y="236" width="54" height="22" rx="3" fill="#fde68a" stroke="#a16207"/>
    <line x1="89" y1="236" x2="89" y2="222" stroke="#44403c" stroke-width="2" marker-end="url(#ah)"/>
    <text x="89" y="290" font-size="13" text-anchor="middle" fill="#78716c">soil CO₂ flux</text>
  </g>
  <text x="140" y="312" font-size="14" text-anchor="middle">low-cost, rapid, in the field</text>
  <!-- step 2: model -->
  <rect x="290" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- pools mini diagram -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="312" y="104" width="54" height="26" rx="3" fill="#fde68a" stroke="#a16207"/><text x="339" y="121">litter</text>
    <rect x="378" y="104" width="54" height="26" rx="3" fill="#fde68a" stroke="#a16207"/><text x="405" y="121">POM</text>
    <rect x="444" y="104" width="54" height="26" rx="3" fill="#e7d3c2" stroke="#7c4a1e"/><text x="471" y="121">MAOM</text>
  </g>
  <g stroke="#44403c" stroke-width="1.6" marker-end="url(#ah)"><line x1="366" y1="117" x2="376" y2="117"/><line x1="432" y1="117" x2="442" y2="117"/></g>
  <text x="400" y="150" font-size="13" text-anchor="middle" fill="#78716c">process model (RothC-type)</text>
  <!-- obs vs model scatter -->
  <g>
    <rect x="330" y="166" width="140" height="110" fill="#fff" stroke="#a8a29e"/>
    <line x1="338" y1="268" x2="462" y2="174" stroke="#a8a29e" stroke-dasharray="4 3"/>
    <g fill="#7c4a1e"><circle cx="352" cy="252" r="3"/><circle cx="366" cy="246" r="3"/><circle cx="380" cy="228" r="3"/><circle cx="392" cy="232" r="3"/><circle cx="404" cy="214" r="3"/><circle cx="418" cy="206" r="3"/><circle cx="430" cy="196" r="3"/><circle cx="446" cy="184" r="3"/><circle cx="410" cy="226" r="3"/><circle cx="372" cy="236" r="3"/></g>
    <text x="400" y="294" font-size="13" text-anchor="middle" fill="#78716c">calibrated on field experiments</text>
  </g>
  <text x="400" y="312" font-size="14" text-anchor="middle">rates set by soil and climate</text>
  <!-- step 3: output -->
  <rect x="550" y="80" width="220" height="240" rx="8" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- stock change bars with uncertainty -->
  <g>
    <line x1="580" y1="250" x2="740" y2="250" stroke="#a8a29e"/>
    <rect x="600" y="190" width="30" height="60" fill="#e7d3c2" stroke="#7c4a1e"/><line x1="615" y1="176" x2="615" y2="204" stroke="#44403c" stroke-width="1.6"/>
    <rect x="645" y="160" width="30" height="90" fill="#7c4a1e"/><line x1="660" y1="140" x2="660" y2="180" stroke="#44403c" stroke-width="1.6"/>
    <rect x="690" y="206" width="30" height="44" fill="#e7d3c2" stroke="#7c4a1e"/><line x1="705" y1="190" x2="705" y2="222" stroke="#44403c" stroke-width="1.6"/>
    <text x="660" y="272" font-size="13" text-anchor="middle" fill="#78716c">stock change ± uncertainty</text>
    <text x="660" y="120" font-size="14" text-anchor="middle">field → region → nation</text>
  </g>
  <text x="660" y="312" font-size="14" text-anchor="middle">credit only what can be verified</text>
  <!-- bottom: target -->
  <rect x="30" y="360" width="740" height="200" rx="8" fill="#fff" stroke="#7c4a1e" stroke-width="1.8"/>
  <text x="400" y="396" font-size="20" font-weight="700" text-anchor="middle" fill="#7c4a1e">Low-cost, high-efficiency MRV for soil-based carbon dioxide removal</text>
  <g font-size="16" text-anchor="middle">
    <text x="400" y="432">Sejong Science Fellowship · National Research Foundation of Korea · 2024–2028</text>
    <text x="400" y="470" fill="#44403c">Pieces already in place: thermal separation of carbon forms (Hyun et al. 2025),</text>
    <text x="400" y="494" fill="#44403c">modified RothC with field-calibrated modifiers and Monte-Carlo uncertainty,</text>
    <text x="400" y="518" fill="#44403c">a national-scale assessment framework (Hyun &amp; Yoo 2024), two patents on SOC-change calculation.</text>
  </g>
</svg>
