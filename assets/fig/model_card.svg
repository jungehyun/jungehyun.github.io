<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1c1917">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44403c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4d7c0f"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c4a1e"/></marker>
  </defs>
  <!-- soil column -->
  <rect x="60" y="90" width="400" height="440" fill="#faf7f3" stroke="#a8a29e" stroke-width="2"/>
  <line x1="60" y1="310" x2="460" y2="310" stroke="#d6d0c8" stroke-width="2"/>
  <line x1="60" y1="420" x2="460" y2="420" stroke="#d6d0c8" stroke-width="2"/>
  <g font-size="22" fill="#78716c" text-anchor="end"><text x="50" y="98">0 cm</text><text x="50" y="538">1 m</text></g>
  <!-- litter in -->
  <text x="260" y="52" font-size="26" text-anchor="middle">plant litter</text>
  <line x1="260" y1="62" x2="260" y2="118" stroke="#4d7c0f" stroke-width="4" marker-end="url(#ahg)"/>
  <!-- pools -->
  <g font-size="30" font-weight="700" text-anchor="middle">
    <rect x="90" y="124" width="150" height="70" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="2"/><text x="165" y="170">POM</text>
    <rect x="290" y="124" width="150" height="70" rx="8" fill="#e7d3c2" stroke="#7c4a1e" stroke-width="2"/><text x="365" y="170">MAOM</text>
  </g>
  <line x1="244" y1="159" x2="284" y2="159" stroke="#44403c" stroke-width="4" marker-end="url(#ah)"/>
  <!-- CO2 -->
  <line x1="165" y1="120" x2="110" y2="74" stroke="#44403c" stroke-width="3" marker-end="url(#ah)"/>
  <text x="96" y="62" font-size="24" text-anchor="middle">CO₂</text>
  <!-- deeper layers -->
  <g font-size="22" fill="#a8a29e" text-anchor="middle"><text x="260" y="370">same pools, each depth</text><text x="260" y="482">↓ transport</text></g>
  <!-- mineral box -->
  <rect x="500" y="200" width="270" height="120" rx="10" fill="#fff" stroke="#7c4a1e" stroke-width="3"/>
  <g font-size="28" font-weight="700" fill="#7c4a1e" text-anchor="middle"><text x="635" y="248">mineral type</text></g>
  <text x="635" y="290" font-size="22" text-anchor="middle" fill="#44403c">not just clay content</text>
  <g stroke="#7c4a1e" stroke-width="3.5" stroke-dasharray="10 8" fill="none" marker-end="url(#aha)">
    <path d="M500 232 C 430 232, 320 226, 268 172"/>
    <path d="M500 290 C 470 290, 452 240, 444 198"/>
  </g>
  <text x="635" y="358" font-size="22" fill="#7c4a1e" text-anchor="middle">formation · turnover</text>
  <!-- constraints -->
  <g font-size="22" fill="#44403c">
    <text x="500" y="470" font-weight="700">calibrated on</text>
    <text x="500" y="502">Δ¹⁴C · fractions · Rh</text>
    <text x="500" y="534">global, 4 depths</text>
  </g>
</svg>
