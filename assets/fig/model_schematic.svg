<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1c1917">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44403c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4d7c0f"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c4a1e"/></marker>
  </defs>
  <!-- soil column -->
  <rect x="70" y="70" width="400" height="470" fill="#faf7f3" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="470" y2="340" stroke="#a8a29e" stroke-width="1.2"/>
  <line x1="70" y1="400" x2="470" y2="400" stroke="#a8a29e" stroke-width="1.2"/>
  <line x1="70" y1="465" x2="470" y2="465" stroke="#a8a29e" stroke-width="1.2"/>
  <g font-size="15" fill="#78716c" text-anchor="end">
    <text x="62" y="76">0 cm</text><text x="62" y="345">15</text><text x="62" y="405">30</text><text x="62" y="470">60</text><text x="62" y="545">100</text>
  </g>
  <!-- plant litter input -->
  <text x="190" y="30" font-size="17" text-anchor="middle">plant litter (NPP)</text>
  <line x1="150" y1="38" x2="150" y2="92" stroke="#4d7c0f" stroke-width="2.5" marker-end="url(#ahg)"/>
  <line x1="230" y1="38" x2="230" y2="92" stroke="#4d7c0f" stroke-width="2.5" marker-end="url(#ahg)"/>
  <!-- litter pools -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="108" y="96" width="84" height="36" rx="4" fill="#dcfce7" stroke="#4d7c0f"/><text x="150" y="120">DPM</text>
    <rect x="188" y="96" width="84" height="36" rx="4" fill="#fde68a" stroke="#a16207"/><text x="230" y="120">RPM</text>
  </g>
  <!-- decomposition node -->
  <circle cx="270" cy="200" r="24" fill="#fff" stroke="#44403c" stroke-width="1.8"/>
  <text x="270" y="206" font-size="13" text-anchor="middle" fill="#44403c">decomp.</text>
  <!-- pools -> node (thin) -->
  <g stroke="#a8a29e" stroke-width="1.3" marker-end="url(#ah)">
    <line x1="150" y1="134" x2="252" y2="186"/>
    <line x1="230" y1="134" x2="263" y2="175"/>
    <line x1="120" y1="262" x2="250" y2="214"/>
    <line x1="210" y1="262" x2="260" y2="224"/>
    <line x1="300" y1="262" x2="282" y2="224"/>
    <line x1="400" y1="262" x2="292" y2="214"/>
  </g>
  <!-- node -> CO2 -->
  <line x1="290" y1="186" x2="380" y2="120" stroke="#44403c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="388" y="112" font-size="17">CO₂ (Rh)</text>
  <text x="352" y="162" font-size="14" fill="#78716c">1 − f</text>
  <!-- node -> retained pools -->
  <line x1="270" y1="224" x2="270" y2="246" stroke="#44403c" stroke-width="2.2"/>
  <line x1="120" y1="246" x2="400" y2="246" stroke="#44403c" stroke-width="2.2"/>
  <g stroke="#44403c" stroke-width="2.2" marker-end="url(#ah)">
    <line x1="120" y1="246" x2="120" y2="262"/><line x1="210" y1="246" x2="210" y2="262"/><line x1="300" y1="246" x2="300" y2="262"/><line x1="400" y1="246" x2="400" y2="262"/>
  </g>
  <text x="288" y="240" font-size="14" fill="#78716c">retained, f</text>
  <!-- stabilised pools -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="80" y="264" width="80" height="36" rx="4" fill="#fde68a" stroke="#a16207"/><text x="120" y="288">BIO</text>
    <rect x="170" y="264" width="80" height="36" rx="4" fill="#fde68a" stroke="#a16207"/><text x="210" y="288">oPOM</text>
    <rect x="260" y="264" width="80" height="36" rx="4" fill="#e7d3c2" stroke="#7c4a1e"/><text x="300" y="288">HUM</text>
    <rect x="360" y="264" width="80" height="36" rx="4" fill="#e7d3c2" stroke="#7c4a1e"/><text x="400" y="288">PAS</text>
  </g>
  <g font-size="14" fill="#78716c" text-anchor="middle">
    <text x="165" y="322">measured as POM</text><text x="350" y="322">measured as MAOM</text>
  </g>
  <!-- collapsed layers -->
  <g font-size="15" fill="#78716c" text-anchor="middle">
    <text x="270" y="375">same pools and flows</text>
    <text x="270" y="437">same pools and flows</text>
    <text x="270" y="507">same pools and flows</text>
  </g>
  <!-- root inputs -->
  <g stroke="#4d7c0f" marker-end="url(#ahg)">
    <line x1="20" y1="370" x2="92" y2="370" stroke-width="2.4"/>
    <line x1="20" y1="432" x2="92" y2="432" stroke-width="1.8"/>
    <line x1="20" y1="502" x2="92" y2="502" stroke-width="1.2"/>
  </g>
  <text x="12" y="590" font-size="15" fill="#4d7c0f">root input, decreasing with depth</text>
  <!-- transport -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)">
    <line x1="440" y1="320" x2="440" y2="362"/><line x1="440" y1="380" x2="440" y2="425"/><line x1="440" y1="445" x2="440" y2="492"/><line x1="440" y1="515" x2="440" y2="568"/>
  </g>
  <text x="448" y="590" font-size="15" fill="#2563eb">transport ↓, export below 100 cm</text>
  <!-- mineral composition box -->
  <rect x="520" y="150" width="260" height="92" rx="6" fill="#f5f5f4" stroke="#7c4a1e" stroke-width="1.8"/>
  <g font-size="16" text-anchor="middle">
    <text x="650" y="176" font-weight="700" fill="#7c4a1e">Mineral composition</text>
    <text x="650" y="200" font-size="14">clay-mineral groups, Fe/Al oxides,</text>
    <text x="650" y="220" font-size="14">non-crystalline phases × clay content</text>
  </g>
  <g stroke="#7c4a1e" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#aha)">
    <path d="M520 185 C 420 185, 360 190, 298 198"/>
    <path d="M560 242 C 560 330, 430 340, 344 302"/>
  </g>
  <text x="400" y="170" font-size="14" fill="#7c4a1e">formation of MAOM, f</text>
  <text x="455" y="348" font-size="14" fill="#7c4a1e">turnover of MAOM, k</text>
  <text x="572" y="268" font-size="13" fill="#78716c">tested placements</text>
  <!-- constraints -->
  <g font-size="15">
    <text x="520" y="372" font-weight="700">Calibrated against</text>
    <text x="520" y="398">SOC stock (0–100 cm)</text>
    <text x="520" y="422">POM / MAOM fractions</text>
    <text x="520" y="446">heterotrophic respiration</text>
    <text x="520" y="470">Δ¹⁴C of bulk, MAOM, POM (ISRaD)</text>
    <text x="520" y="520" fill="#78716c" font-size="14">rates × temperature · moisture ·</text>
    <text x="520" y="540" fill="#78716c" font-size="14">plant cover · depth</text>
  </g>
</svg>
